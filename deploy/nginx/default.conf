# Reverse proxy: TLS termination, security headers, rate limiting, /metrics blocked.
log_format json_combined escape=json
  '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"rt":$request_time,"request_id":"$request_id","ua":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream app_upstream {
  server app:8000;
}

server {
  listen 8080;
  server_name _;
  access_log /dev/stdout json_combined;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 8443 ssl;
  server_name _;
  access_log /dev/stdout json_combined;

  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:5m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  server_tokens off;
  client_max_body_size 256k;

  # Internal metrics are not exposed publicly.
  location = /metrics { return 404; }

  # ── Static frontend ──────────────────────────────────────────
  location /frontend/ {
    alias /usr/share/nginx/html/frontend/;
    index index.html;
    try_files $uri $uri/ /frontend/index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Redirect root to the frontend UI
  location = / {
    return 302 /frontend/;
  }

  location = /auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }
}
