name: school

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school}
      POSTGRES_USER: ${DB_USER:-school}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt: ["no-new-privileges:true"]

  app:
    image: ${IMAGE:-school-attendance-api}:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        APP_VERSION: ${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-school}
      DB_USER: ${DB_USER:-school}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SEED_PASSWORD_FILE: /run/secrets/seed_password
      SEED_ON_START: ${SEED_ON_START:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-60}
      APP_VERSION: ${IMAGE_TAG:-local}
    secrets: [db_password, jwt_secret, seed_password]
    networks: [backend]            # no published ports: only reachable via the proxy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8081}:8080"
      - "${HTTPS_PORT:-8444}:8443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
    networks: [backend, edge]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  backend:
    internal: true                 # db/app have no route to or from the outside world
  edge: {}

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  seed_password:
    file: ./secrets/seed_password.txt
