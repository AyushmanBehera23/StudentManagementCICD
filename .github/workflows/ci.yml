name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # least privilege by default; jobs elevate only where needed

env:
  IMAGE_NAME: ghcr.io/ayushmanbehera23/studentmanagementcicd

jobs:
  lint:
    name: Format, lint, static security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Bandit (static security analysis)
        run: bandit -q -r app
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt
      - name: Validate compose file
        run: |
          mkdir -p secrets && for s in db_password jwt_secret seed_password; do echo x > secrets/$s.txt; done
          docker compose config -q

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: school_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-password@localhost:5432/school_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run API tests
        run: pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  integration:
    name: Compose stack + smoke test (TLS proxy)
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|^IMAGE=.*|IMAGE=school-attendance-api|; s|^IMAGE_TAG=.*|IMAGE_TAG=ci|' .env
          scripts/gen-secrets.sh
          scripts/gen-certs.sh
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test (includes role-restriction acceptance test)
        run: scripts/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  build:
    name: Build, scan and publish image
    runs-on: ubuntu-24.04
    needs: [integration]
    permissions:
      contents: read
      packages: write
      security-events: write  # required for Trivy SARIF upload
      id-token: write         # required for provenance attestation
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scan-target:ci
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push versioned image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true
      - name: Record image tag and digest (evidence)
        if: github.event_name != 'pull_request' && steps.push.outputs.digest != ''
        run: |
          {
            echo "### Published image"
            echo "- Tags:"; echo '```'; echo "${{ steps.meta.outputs.tags }}"; echo '```'
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" > image-digest.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.push.outputs.digest != ''
        with:
          name: image-digest
          path: image-digest.txt
